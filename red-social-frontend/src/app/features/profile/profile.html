<!-- Angular Profile Component Template (Tailwind CSS) -->
<section class="min-h-screen bg-gray-950 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- Profile Card -->
    <div class="bg-black rounded-2xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl">
      <!-- Cover / Header Section (gradient) -->
      <div class="relative h-32 sm:h-40 bg-gradient-to-r from-blue-500 to-purple-600">
        <!-- Optional decorative pattern -->
        <div
          class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDYwIDYwIj48cGF0aCBkPSJNMzAgMTBhMjAgMjAgMCAxIDAgNDAgMjAgMjAgMjAgMCAwIDAtNDAtMjB6IiBmaWxsPSIjZmZmIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiLz48L3N2Zz4=')]"
        ></div>
      </div>

      <!-- Profile Info -->
      <div class="relative px-4 sm:px-6 pb-6">
        <!-- Avatar section - overlapped -->
        <div class="flex flex-col sm:flex-row items-center sm:items-end -mt-12 sm:-mt-16 mb-4">
          <!-- Profile Image -->
          <div class="relative">
            <img
              [src]="imagenPerfil()"
              alt="Profile picture"
              class="w-24 h-24 sm:w-32 sm:h-32 rounded-full border-4 border-black shadow-lg object-cover bg-purple-900"
              onerror="this.src = 'https://ui-avatars.com/api/?name=Juan+Perez&size=128&background=random'"
            />
            <!-- Status indicator (optional) -->
            <span
              class="absolute bottom-1 right-1 block w-4 h-4 rounded-full bg-green-400 border-2 border-black"
            ></span>
          </div>

          <!-- Name & Username - visible on small screens below avatar, on larger screens beside -->
          <div class="sm:ml-5 mt-3 sm:mt-0 text-center sm:text-left flex-1">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">{{ nombre() }} {{ apellido() }}</h1>
            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 text-sm text-gray-500">
              <span class="font-mono bg-gray-900 px-3 py-1 rounded-full">@{{ username() }}</span>
              <span class="hidden sm:inline">•</span>
              <span class="flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  />
                </svg>
                <a href="mailto:{{ email() }}" class="text-blue-600 hover:underline truncate max-w-[180px]">
                  {{ email() }}
                </a>
              </span>
            </div>
          </div>
        </div>

        <!-- Birthdate & Description -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 pt-4 border-t border-gray-100">
          <!-- Birthdate -->
          <div class="col-span-1 flex items-center gap-3 text-sm text-gray-600">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <div>
              <span class="block text-xs uppercase tracking-wider text-gray-400">Birthdate</span>
              <span class="font-medium">{{ fechaNacimiento() }}</span>
            </div>
          </div>

          <!-- Created At -->
          <div class="col-span-1 flex items-center gap-3 text-sm text-gray-600">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <div>
              <span class="block text-xs uppercase tracking-wider text-gray-400">Joined</span>
              <span class="font-medium">{{ createdAt() }}</span>
            </div>
          </div>

          <!-- Additional info placeholder (optional) -->
          <div class="col-span-1 flex items-center gap-3 text-sm text-gray-600">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <div>
              <span class="block text-xs uppercase tracking-wider text-gray-400">Status</span>
              <span class="font-medium text-green-600">Active</span>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="mt-5 p-4 bg-gray-950 rounded-xl border border-gray-100">
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-gray-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"
              />
            </svg>
            <div>
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">About</h3>
              <p class="text-gray-700 mt-1 leading-relaxed">{{ descripcion || 'No description provided.' }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
