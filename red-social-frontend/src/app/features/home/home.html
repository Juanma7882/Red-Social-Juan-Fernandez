<section class="w-full min-h-dvh justify-start items-center flex pt-6 flex-col gap-4 bg-slate-950">
  <!-- Selector de orden -->
  <div class="w-full sm:w-2/3 md:w-2/3 lg:w-2/4 flex flex-col gap-2">
    <span class="text-slate-500 text-xs font-semibold uppercase tracking-widest px-1">Ordenar por</span>
    <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
      @for (option of listOrder; track option) {
        <button
          (click)="changeOrder(option)"
          [class]="order === option
            ? 'py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 cursor-pointer bg-amber-400 text-slate-950 shadow-sm'
            : 'py-2 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 cursor-pointer text-slate-400 hover:text-slate-100 hover:bg-slate-800'"
        >
          {{ orderLabels[option] }}
        </button>
      }
    </div>
  </div>
  <!-- Posts -->
  @for (post of postsList(); track post._id) {
    <app-posts
      class="w-full sm:w-2/3 md:w-2/3 lg:w-2/4"
      [id]="post._id"
      [nombreUsuario]="post.usuarioId.username"
      [fechaDeCreacion]="post.createdAt"
      [titulo]="post.titulo"
      [imagenPerfil]="post.usuarioId.imagenPerfil"
      [descripcion]="post.mensaje"
      [imagen]="post.imagen"
      [meGusta]="post.likes.length.toString()"
      [comentarios]="post.commentCount.toString()"
      (meGustaToggled)="handleLike($event)"
      (deletePost)="handleDelete($event)"
      [isLiked]="post.isLiked || false"
      [canDelete]="post.canDelete || false"
    />
  } @empty {
    @if (!isLoading()) {
      <div class="text-center py-4 text-gray-500">No posts available</div>
    }
  }

  @if (isLoading()) {
    <div class="py-4">Loading more posts...</div>
  }

  <div #loadMoreTrigger class="h-10"></div>
</section>
